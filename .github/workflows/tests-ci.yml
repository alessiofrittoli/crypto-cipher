name: Unit Tests

on: ['push']

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Setup environment
        uses: alessiofrittoli/github-actions/.github/actions/setup-pnpm-node@v1.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Linting
        run: pnpm lint

      - name: Run unit tests
        run: pnpm test:coverage:ci

      - name: Report to Coveralls
        uses: coverallsapp/github-action@v2
        if: success()
        continue-on-error: true
        with:
          github-token: ${{ secrets.COVERALLS_REPO_TOKEN }}
          file: coverage/clover.xml
          allow-empty: true
